<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>작업 큐</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><span class="eyebrow">LOCAL WORKSPACE</span><h1>작업 큐</h1><p>작업 실행 상태를 실시간으로 확인해.</p></div><span class="live"><i></i> 1초마다 갱신</span></header><div id="message" role="status" aria-live="polite"></div><section class="panel"><h2>새 작업</h2><form id="form"><label class="grow">제목<input name="title" required maxlength="200" placeholder="작업 이름 입력"></label><label>실행 시간 (ms)<input name="duration_ms" type="number" min="100" max="5000" value="1000" required></label><label class="check"><input name="fail_first_attempt" type="checkbox"> 첫 시도 실패</label><button type="submit">작업 추가</button></form></section><section><div class="section-head"><div><span class="eyebrow">OVERVIEW</span><h2>작업 현황</h2></div></div><div id="stats" class="stats"></div></section><section class="panel"><div class="section-head"><div><span class="eyebrow">QUEUE</span><h2>작업 목록</h2></div><label>상태 <select id="filter"><option value="">전체</option><option value="queued">대기</option><option value="running">실행 중</option><option value="completed">완료</option><option value="failed">실패</option><option value="cancelled">취소</option></select></label></div><div id="jobs" class="jobs"></div></section></main><script src="/app.js"></script></body></html>
